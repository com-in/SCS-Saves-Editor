name: 构建测试

on:
  push:
    # 除“指定版本号标签(v1.x.y，归发布流程)”外的所有推送——任意分支、非版本标签——一律进入测试构建，仅产测试产物不发布
    branches:
      - "**"
    tags:
      - "!v*.*.*"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 用 PyInstaller 打包（含 icon.ico）
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "SCS存档修改器" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --hidden-import numpy `
            --hidden-import numpy.core `
            --collect-all numpy `
            "main.py"
        shell: pwsh

      # 产物仅保留在构建环境中，不上传、不发布、不进 Release
      - name: 校验打包产物存在
        run: |
          Test-Path "dist/SCS存档修改器.exe"
