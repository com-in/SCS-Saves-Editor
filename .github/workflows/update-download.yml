name: 更新首页下载与 Pages

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-download-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 校验下载链接更新逻辑
        run: node --test .github/scripts/update-download.test.cjs
      - name: 读取 Release 并更新加速下载地址
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const fs = require('node:fs');
            const { updateDownload } = require('./.github/scripts/update-download.cjs');
            const params = { owner: context.repo.owner, repo: context.repo.repo };
            let release;
            if (process.env.RELEASE_TAG) {
              release = (await github.rest.repos.getReleaseByTag({ ...params, tag: process.env.RELEASE_TAG })).data;
            } else if (context.payload.release) {
              release = (await github.rest.repos.getRelease({ ...params, release_id: context.payload.release.id })).data;
            } else {
              release = (await github.rest.repos.getLatestRelease(params)).data;
            }
            if (release.draft) throw new Error('不能使用草稿 Release。');
            const path = 'docs/index.html';
            const html = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, updateDownload(html, release, `${context.repo.owner}/${context.repo.repo}`));
            core.info(`已更新到 ${release.tag_name}`);
      - name: 提交首页更新
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- docs/index.html; then
            git add docs/index.html
            git commit -m 'docs: update accelerated release download'
            git push origin HEAD
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.commit }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
