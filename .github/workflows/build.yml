name: 打包发布

on:
  push:
    tags:
      # 仅“指定版本号标签”(如 v1.1.0) 触发发布流程；其它推送一律走测试构建
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 用 PyInstaller 打包（含 icon.ico）
        # Embed the tag so released executables compare against their own version.
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python .github/scripts/stamp-version.py
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "SCS" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --add-data "docs/mods_index.json;docs" `
            --hidden-import numpy `
            --hidden-import numpy.core `
            --collect-all numpy `
            --hidden-import unity_scene_loader `
            --collect-all UnityPy `
            "main.py"
        shell: pwsh

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: SCS存档修改器
          path: dist/SCS.exe

      - name: 创建 GitHub Release（仅标签推送时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SCS.exe
          generate_release_notes: true

  update-download:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/update-download.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      release_tag: ${{ github.ref_name }}
